apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: l1-geth
  namespace: default
spec:
  serviceName: l1-geth
  replicas: 1
  selector:
    matchLabels:
      app: l1-geth
  template:
    metadata:
      labels:
        app: l1-geth
    spec:
      initContainers:
      - name: l1-create-beacon-chain-genesis
        image: "gcr.io/prysmaticlabs/prysm/cmd/prysmctl:HEAD-aec349"
        args:
          - testnet
          - generate-genesis
          - --fork=deneb
          - --num-validators=4
          - --genesis-time-delay=0
          - --output-ssz=/consensus/genesis.ssz
          - --chain-config-file=/chain-config/config.yml
          - --geth-genesis-json-in=/genesis-config/genesis-raw.json
          - --geth-genesis-json-out=/execution/genesis.json
        volumeMounts:
        - name: datadir
          mountPath: /execution
          readOnly: false
        - name: datadir
          mountPath: /consensus
          readOnly: false
        - name: chain-config-vol
          mountPath: /chain-config
        - name: genesis-config-vol
          mountPath: /genesis-config

      - name: l1-fix-genesis-fork-times
        image: "alpine:3.19.0"
        command:
          - /bin/sh
          - -c
          - |
            echo "Fixing genesis.json fork times..."
            sed -i 's/"shanghaiTime": [0-9]*/"shanghaiTime": 0/g' /execution/genesis.json
            sed -i 's/"cancunTime": [0-9]*/"cancunTime": 0/g' /execution/genesis.json
            echo "Genesis.json: shanghai=0, cancun=0 (MCOPY enabled)"
            cat /execution/genesis.json | grep -E "(shanghaiTime|cancunTime)"
        volumeMounts:
        - name: datadir
          mountPath: /execution
          readOnly: false

      - name: l1-geth-genesis
        image: "ethereum/client-go:v1.14.5"
        args:
          - --datadir=/execution
          - --gcmode=archive
          - init
          - --state.scheme=hash
          - /execution/genesis.json
        volumeMounts:
        - name: datadir
          mountPath: /execution
          readOnly: false

      - name: copy-keystore
        image: "alpine:3.19.0"
        command:
          - /bin/sh
          - -c
          - |
            mkdir -p /execution/keystore
            cp /tmp/keystore/* /execution/keystore/
            ls -la /execution/keystore/
        volumeMounts:
        - name: datadir
          mountPath: /execution
          readOnly: false
        - name: keystore-config-vol
          mountPath: /tmp/keystore

      containers:
      # NOTE: For checking configs inside volumes
      - name: test
        image: nginx:1.25
        volumeMounts:
        - name: datadir
          mountPath: /execution
          readOnly: false
        - name: jwtsecret-vol
          mountPath: /execution/jwtsecret
          subPath: jwtsecret
        - name: keystore-config-vol
          mountPath: /execution/keystore

      - name: l1-geth
        image: ethereum/client-go:v1.14.5
        command:
        - geth
        args:
        - --http
        - --http.api=eth,net,web3,debug,admin
        - --http.addr=0.0.0.0
        - --http.corsdomain=*
        - --http.vhosts=*
        - --ws
        - --ws.api=eth,net,web3,debug
        - --ws.addr=0.0.0.0
        - --ws.origins=*
        - --authrpc.vhosts=*
        - --authrpc.addr=0.0.0.0
        - --authrpc.jwtsecret=/execution/jwtsecret
        - --datadir=/execution
        - --allow-insecure-unlock
        - --unlock=0x123463a4b065722e99115d6c222f267d9cabb524
        - --password=/execution/geth_password.txt
        - --nodiscover
        - --syncmode=full
        - --gcmode=archive
        - --ipcdisable
        - --rpc.allow-unprotected-txs
        - --verbosity=3
        ports:
        - containerPort: 8545
          name: rpc
        - containerPort: 8551
          name: auth
        - containerPort: 8546
          name: websocket
        readinessProbe:
          httpGet:
            path: /
            port: 8545
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /
            port: 8545
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: datadir
          mountPath: /execution
          readOnly: false
        - name: jwtsecret-vol
          mountPath: /execution/jwtsecret
          subPath: jwtsecret
          readOnly: true
        - name: geth-password-vol
          mountPath: /execution/geth_password.txt
          subPath: geth_password.txt
          readOnly: true
        # NOTE: Do not do this, some weird bug where geth does not see this keystore
        # - name: keystore-config-vol
        #   mountPath: /execution/keystore

      volumes:
      - name: jwtsecret-vol
        secret:
          secretName: jwtsecret
      - name: geth-password-vol
        secret:
          secretName: geth-password
      - name: chain-config-vol
        configMap:
          name: chain-config
          items:
          - key: config.yml
            path: config.yml
      - name: genesis-config-vol
        configMap:
          name: genesis-raw-config
          items:
          - key: genesis-raw.json
            path: genesis-raw.json
      - name: keystore-config-vol
        configMap:
          name: keystore-config
          items:
          - key: keystore.json
            path: UTC--2022-08-19T17-38-31.257380510Z--123463a4b065722e99115d6c222f267d9cabb524

  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: l1-geth
  labels:
    app: l1-geth
spec:
  type: ClusterIP
  ports:
  - name: http-rpc
    port: 8545
    targetPort: 8545
    protocol: TCP
  - name: ws-rpc
    port: 8546
    targetPort: 8546
    protocol: TCP
  - name: auth-rpc
    port: 8551
    targetPort: 8551
    protocol: TCP
  selector:
    app: l1-geth
